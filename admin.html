<style>
:root{--red:#7a1220;--rose:#d8344a;--cream:#fffbf2;--line:#f0d9cc}
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:var(--cream);color:#2b1a1c}
header{background:linear-gradient(135deg,#7a1220,#d8344a);color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px}
header h1{font-size:1.15rem;margin:0}header a,header button{color:#fff;background:rgba(255,255,255,.18);border:0;border-radius:999px;padding:8px 16px;font:inherit;cursor:pointer;text-decoration:none}
main{max-width:1100px;margin:18px auto;padding:0 14px}
.box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px}
input,select{font:inherit;padding:9px 10px;border:1px solid #d9c2b8;border-radius:10px;width:100%;background:#fff}
label{display:block;font-size:.85rem;margin:8px 0 4px;color:#6b4a4f}
button.p{background:var(--red);color:#fff;border:0;border-radius:999px;padding:10px 20px;font:inherit;cursor:pointer}
button.p:hover{background:var(--rose)}button.s{background:#fff;border:1px solid var(--red);color:var(--red);border-radius:999px;padding:8px 14px;font:inherit;cursor:pointer}
button.d{background:#fff;border:1px solid #c33;color:#c33;border-radius:999px;padding:8px 14px;font:inherit;cursor:pointer}
.login{max-width:380px;margin:60px auto}.msg{margin:10px 0;padding:10px 12px;border-radius:10px;background:#fff3f3;color:#a11;display:none}.msg.ok{background:#eefaf1;color:#176b34}
.row{display:grid;grid-template-columns:70px 1.1fr 2fr .8fr .8fr auto;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:10px 0}
.row img{width:60px;height:75px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.row.hid{opacity:.55}.acts{display:flex;gap:6px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
@media(max-width:760px){.row{grid-template-columns:70px 1fr}.row>*:nth-child(n+3){grid-column:1/-1}}
small{color:#7a5a5f}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.tabs button{background:#fff;border:1px solid var(--red);color:var(--red);border-radius:999px;padding:9px 18px;font:inherit;cursor:pointer}.tabs button.on{background:var(--red);color:#fff}
.savebar{position:sticky;top:0;z-index:5;background:var(--cream);padding:8px 0;display:flex;gap:10px;align-items:center;justify-content:flex-end}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0}.fr3{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:8px;align-items:end;margin:6px 0}
.it{border-bottom:1px solid var(--line);padding:10px 0}.it:last-child{border:0}.hd{display:flex;align-items:center;gap:8px;margin:4px 0}.hd input[type=checkbox]{width:auto}
textarea{font:inherit;padding:9px 10px;border:1px solid #d9c2b8;border-radius:10px;width:100%;min-height:60px}
.ltr{direction:ltr;text-align:left}
@media(max-width:760px){.fr,.fr3{grid-template-columns:1fr}}
</style></head><body>

$('p_dr').innerHTML=h+'<p><button class="s" id="addDoc">+ إضافة طبيب</button></p></div>'}
function readDoc(){var L=[];document.querySelectorAll('#p_dr .it').forEach(function(r){L.push({ar:r.querySelector('[data-dn=ar]').value.trim(),en:r.querySelector('[data-dn=en]').value.trim(),hidden:r.querySelector('[data-dh]').checked})});return L}
$('p_dr').onclick=function(e){var b=e.target.closest('button');if(!b)return;var L=C.doctors=readDoc();if(b.id==='addDoc'){L.push({ar:'',en:'',hidden:false})}else{var i=+b.closest('.it').dataset.d,m=b.dataset.m;if(m==='x'){if(!confirm('حذف هذا الطبيب؟'))return;L.splice(i,1)}else{var j=m==='u'?i-1:i+1;if(j<0||j>=L.length)return;var t=L[i];L[i]=L[j];L[j]=t}}renderDoc()};
var CTL=[['facebook','فيسبوك (رابط الصفحة)'],['instagram','إنستجرام (رابط الحساب)'],['tiktok','تيك توك'],['snapchat','سناب شات'],['threads','ثريدز']];
function renderCt(){var c=C.contact,h='<div class="box"><h3 style="margin-top:0">التواصل</h3><label>رقم الهاتف وواتساب (بالصيغة الدولية بدون + ومسافات)</label><input id="c_phone" class="ltr" value="'+esc(c.phone||D.phone)+'"><small>يغيّر الاتصال وكل أزرار واتساب ورقم الفرع في الموقع</small><div class="fr"><div><label>ساعات العمل (عربي)</label><input id="c_hA" value="'+esc(c.hours_ar||'')+'"></div><div><label>Working hours (English)</label><input class="ltr" id="c_hE" value="'+esc(c.hours_en||'')+'"></div></div><small>اتركها فارغة لو مش عايز تعرض ساعات. تظهر داخل بطاقة الفرع.</small>';
CTL.forEach(function(x){h+='<label>'+x[1]+' (اتركه فارغًا للرابط الحالي)</label><input class="ltr" id="c_'+x[0]+'" value="'+esc(c[x[0]]||'')+'" placeholder="https://">'});
h+=fld('brName','اسم الفرع')+fld('brAddr','العنوان')+fld('brAddrS','العنوان المختصر')+'</div>';$('p_ct').innerHTML=h}
var TXG=[['الصفحة الرئيسية',['badge','h1','heroP','contactUs','call','prT','prP','prB','svcT','svcS','whyT','whyS','w1t','w1d','w2t','w2d','w3t','w3d','w4t','w4d','brT','brS']],['من نحن',['abH','abP','stT','stD','viT','viD','miT','miD','prmT','prmD','vaT','vaS','v1t','v1d','v2t','v2d','v3t','v3d','v4t','v4d','drT','drS']],['عناوين الصفحات',['ofH','ofP','svH','svP','shopH','shopP','pNote','ctH','ctP','ctNote','soonT','soonD','ofSoonD','svSoonD']],['الفوتر والتواصل الاجتماعي',['footP','copy','folBadge','folT','folS','quick','ourBr']]];
function renderTx(){var h='';TXG.forEach(function(g){h+='<div class="box"><h3 style="margin-top:0">'+g[0]+'</h3>';g[1].forEach(function(k){h+='<div class="it">'+fld(k,k==='h1'?'العنوان (الفاصل بين السطرين: &lt;br&gt;)':tx(k,'ar').slice(0,40),true)+'</div>'});h+='</div>'});$('p_tx').innerHTML=h;fixTA($('p_tx'))}
function syncFlags(){var f=C.flags;if($('f_off')){f.offers_off=$('f_off').checked;f.offers_end=saToIso($('f_end').value);var cs=[],rw=[],pr={};D.offers.forEach(function(g){if($('oc_'+g.k).checked)cs.push(g.k);g.rows.forEach(function(r){if($('or_'+r.k).checked)rw.push(r.k);var p=$('pp_'+r.k).value,o=$('po_'+r.k).value;if(String(p)!==String(r.p==null?'':r.p)||String(o)!==String(r.o?r.o:''))pr[r.k]={p:p===''?null:Number(p),o:o===''?0:Number(o)}})});if($('oc_big').checked)cs.push('big');f.off_cards=cs;f.off_rows=rw;C.prices=pr}
 if($('p_sv').querySelector('.it')){var hs=[],wa={};for(var i=1;i<=8;i++){if($('sh_'+i).checked)hs.push(i);var w=$('sw_'+i).value.trim();if(w&&w!==D.was[i-1])wa[i]=w}f.svc_hidden=hs;C.svc_wa=wa}
 if($('c_phone')){var c=C.contact;c.phone=$('c_phone').value.replace(/\D/g,'')||D.phone;c.hours_ar=$('c_hA').value.trim();c.hours_en=$('c_hE').value.trim();CTL.forEach(function(x){c[x[0]]=$('c_'+x[0]).value.trim()})}
 if($('p_dr').querySelector('.it'))C.doctors=readDoc()}
function collect(){var t=C.texts;document.querySelectorAll('[data-tk]').forEach(function(e){var k=e.dataset.tk,l=e.dataset.l,v=e.value;var d=tx(k,l);if(!t[k])t[k]={};if(v!==d)t[k][l]=v;else delete t[k][l];if(!Object.keys(t[k]).length)delete t[k]})}
function clean(o){var r={};Object.keys(o).forEach(function(k){var v=o[k];if(v===''||v==null||v===false)return;if(Array.isArray(v)&&!v.length)return;r[k]=v});return r}
$('saveAll').onclick=function(){syncFlags();collect();var c=clean(C.contact);if(c.phone===D.phone)delete c.phone;
 var fl=clean(C.flags);var rows=[{key:'texts',value:C.texts},{key:'prices',value:C.prices},{key:'flags',value:fl},{key:'contact',value:c},{key:'svc_wa',value:C.svc_wa}];
 var dc=C.doctors;if(dc&&JSON.stringify(dc.map(function(d){return[d.ar,d.en,!!d.hidden]}))!==JSON.stringify(D.doctors.map(function(d){return[d.ar,d.en,false]})))rows.push({key:'doctors',value:dc.filter(function(d){return d.ar})});else rows.push({key:'doctors',value:null});
 rows=rows.map(function(r){return{key:r.key,value:r.value===null?[]:r.value,updated_at:new Date().toISOString()}});
 var b=$('saveAll');b.disabled=true;msg($('sm'),'جارٍ الحفظ...',1);
 api('/rest/v1/site_content?on_conflict=key',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(rows)}).then(function(r){if(!r.ok)throw 0;msg($('sm'),'تم الحفظ. التغيير يظهر في الموقع فورًا.',1)}).catch(function(){msg($('sm'),'لم يتم الحفظ')}).then(function(){b.disabled=false})};
$('npb').onclick=function(){var v=$('npw').value;if(v.length<8){msg($('npm'),'كلمة المرور قصيرة');return}api('/auth/v1/user',{method:'PUT',body:JSON.stringify({password:v})}).then(function(r){if(!r.ok)throw 0;$('npw').value='';msg($('npm'),'تم تغيير كلمة المرور',1)}).catch(function(){msg($('npm'),'لم يتم التغيير. سجل الدخول مرة أخرى ثم جرب')})};
function loadC(){return api('/rest/v1/site_content?select=key,value').then(function(r){return r.json()}).then(function(rows){rows.forEach(function(r){var v=r.value;if(r.key==='doctors'){C.doctors=Array.isArray(v)&&v.length?v:null}else C[r.key]=v});C.flags=C.flags||{};C.prices=C.prices||{};C.contact=C.contact||{};C.texts=C.texts||{};C.svc_wa=C.svc_wa||{};if(Array.isArray(C.flags))C.flags={};if(Array.isArray(C.prices))C.prices={};if(Array.isArray(C.contact))C.contact={};if(Array.isArray(C.texts))C.texts={};if(Array.isArray(C.svc_wa))C.svc_wa={};renderOffers();renderSvc();renderDoc();renderCt();renderTx()})}
$('tabs').onclick=function(e){var b=e.target.closest('button');if(!b)return;syncFlags();collect();[].forEach.call($('tabs').children,function(x){x.classList.toggle('on',x===b)});['pr','of','sv','dr','ct','tx'].forEach(function(t){$('p_'+t).hidden=t!==b.dataset.t});$('savebar').hidden=b.dataset.t==='pr'};
</script></body></html>
